version: '3.8'

services:
  beammp-configurator:
    build: .
    container_name: beammp-configurator
    ports:
      - "5000:5000"
    volumes:
      - ./config:/config
      - ./backup:/backup
      - ./server:/server
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=production
      - CONFIG_DIR=/server
      - BACKUP_DIR=/backup
      - BEAMMP_CONTAINER_NAME=beammp-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - beammp-network

volumes:
  backups:
    driver: local
  logs:
    driver: local 