services:
  beammp-configurator:
    # image: ghcr.io/v5u2/beammp-server-configurator:latest # To pull the latest image from GitHub Container Registry instead of building locally
    build: . # To build the image locally
    container_name: beammp-configurator
    ports:
      - "5000:5000"
    volumes:
      - ${CONFIG_DATA}:/config
      - ${BACKUP_DATA}:/backup
      - ${SERVER_DATA}:/server
    environment:
      # Gunicorn settings
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_BIND=${GUNICORN_BIND:-0.0.0.0:5000}
      - GUNICORN_ACCESS_LOG=${GUNICORN_ACCESS_LOG:--}
      # App settings
      - CONFIG_DIR=${CONFIG_DIR:-/config}
      - BACKUP_DIR=${BACKUP_DIR:-/backup}
      - SERVER_DIR=${SERVER_DIR:-/server}
      - BEAMMP_CONTAINER_NAME=${BEAMMP_CONTAINER_NAME:-beammp-server}
      - DOCKER_HOST=${DOCKER_HOST:-http://docker-proxy:2375}
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - AUTH_MODE=${AUTH_MODE:-BASIC}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_AUTHORIZE_URL=${OAUTH_AUTHORIZE_URL:-}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL:-}
      - OAUTH_SCOPE=${OAUTH_SCOPE:-openid email profile}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:5000/oauth/callback}
      - OAUTH_PROVIDER=${OAUTH_PROVIDER:-authentik}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_JWKS_URL=${OIDC_JWKS_URL:-}
      - SAML_IDP_METADATA_URL=${SAML_IDP_METADATA_URL:-}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-http://localhost:5000/saml/metadata}
      - SAML_SP_ACS_URL=${SAML_SP_ACS_URL:-http://localhost:5000/saml/acs}
      - SAML_SP_CERT=${SAML_SP_CERT:-}
      - SAML_SP_KEY=${SAML_SP_KEY:-}
    restart: unless-stopped
    networks:
      - beammp-network

  beammp-server:
    image: ich777/beamng-mp-server
    container_name: beammp-server
    environment:
      - TZ=Australia/Perth
      - GAME_PARAMS=
      - UID=99
      - GID=100
      - UMASK=0000
    ports:
      - "30814:30814/tcp"
      - "30814:30814/udp"
      - "9045:8080/tcp"
    volumes:
      - ${SERVER_DATA}:/beamngmp
    restart: unless-stopped
    networks:
      - beammp-network

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    environment:
      - CONTAINERS=1   # Allow access to containers endpoints
      - POST=1         # Allow POST (for restart)
      - GET=1          # Allow GET (for status)
      - LOGS=1         # Allow logs endpoint
      - NETWORKS=0
      - IMAGES=0
      - AUTH=0
      - INFO=0
      - SYSTEM=0
      - VOLUMES=0
      - BUILD=0
      - EVENTS=0
      - PING=1         # Allow ping for healthcheck
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - beammp-network

networks:
  beammp-network:
    driver: bridge 