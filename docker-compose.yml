version: '3.8'

services:
  beammp-configurator:
    build: .
    container_name: beammp-configurator
    ports:
      - "5000:5000"
    volumes:
      # Mount the directory containing your ServerConfig.toml
      - ./configs:/app/configs:ro
      # Mount backups directory for persistence
      - ./backups:/app/backups
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - CONFIG_DIR=/app/configs
      - BACKUP_DIR=/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - beammp-network

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: beammp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - beammp-configurator
    restart: unless-stopped
    networks:
      - beammp-network
    profiles:
      - production

networks:
  beammp-network:
    driver: bridge

volumes:
  backups:
    driver: local
  logs:
    driver: local 