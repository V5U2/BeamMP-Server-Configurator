version: '3.8'

services:
  beammp-configurator:
    build: .
    container_name: beammp-configurator
    ports:
      - "5000:5000"
    volumes:
      # Mount the directory containing your ServerConfig.toml
      - ./configs:/app/configs:ro
      # Mount backups directory for persistence
      - ./backups:/app/backups
      # Mount logs directory
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=production
      - CONFIG_DIR=/app/configs
      - BACKUP_DIR=/app/backups
      - BEAMMP_CONTAINER_NAME=beammp-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - beammp-network

volumes:
  backups:
    driver: local
  logs:
    driver: local 